<!doctype html>
<html lang="en" class="bg-black text-white selection:bg-white/20 selection:text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>KashhCMD — Web Designer & Discord Bot Developer (Dev)</title>
    <meta
      name="description"
      content="KashhCMD builds Discord bots and web apps — Rainbow Leaderboard, ScriptForge and Melon. React, TypeScript, Node.js, discord.js, PostgreSQL, Docker. (Development Version)"
    />
    <meta name="author" content="KashhCMD" />
    <meta name="keywords" content="Discord bot developer, web developer, React, TypeScript, Node.js, discord.js, Rainbow Leaderboard, ScriptForge, portfolio, development" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://kashcmdd.github.io/portfolio-dev/" />

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KashhCMD" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="KashhCMD" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- RSS Feed -->
    <!-- rss.xml is generated into dist/ rather than committed to public/, so Vite
         has no asset record for it and leaves a bare /rss.xml pointing at the
         domain root. %BASE_URL% is textual substitution and does get rewritten. -->
    <link rel="alternate" type="application/rss+xml" title="KashhCMD Journal RSS Feed" href="%BASE_URL%rss.xml" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KashhCMD (Dev)" />
    <meta property="og:url" content="https://kashcmdd.github.io/portfolio-dev/" />
    <meta property="og:title" content="KashhCMD — Web Designer & Discord Bot Developer (Dev)" />
    <meta
      property="og:description"
      content="Discord bots and web apps, built end to end. Rainbow Leaderboard, ScriptForge, Melon — React, TypeScript, Node.js, discord.js, PostgreSQL. (Development Version)"
    />
    <meta property="og:image" content="https://kashcmdd.github.io/portfolio-dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KashhCMD — Discord bots and web apps, built end to end. (Development Version)" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KashhCMD — Web Designer & Discord Bot Developer (Dev)" />
    <meta
      name="twitter:description"
      content="Discord bots and web apps, built end to end. Rainbow Leaderboard, ScriptForge, Melon — React, TypeScript, Node.js, discord.js, PostgreSQL. (Development Version)"
    />
    <meta name="twitter:image" content="https://kashcmdd.github.io/portfolio-dev/og-image.jpg" />
    <meta name="twitter:creator" content="@kashcmdd" />

    <!-- Additional SEO -->
    <meta name="google-site-verification" content="" />
    <meta name="msvalidate.01" content="" />
    <link rel="author" href="https://github.com/kashcmdd" />
    <link rel="me" href="https://github.com/kashcmdd" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "KashhCMD",
      "url": "https://kashcmdd.github.io/portfolio-dev/",
      "sameAs": ["https://github.com/kashcmdd"],
      "jobTitle": "Web Designer & Discord Bot Developer",
      "description": "Web designer and Discord bot developer who enjoys building modern digital experiences. (Development Version)",
      "knowsAbout": ["React", "TypeScript", "Node.js", "Discord.js", "PostgreSQL", "Docker", "Next.js", "GSAP"],
      "worksFor": {
        "@type": "Organization",
        "name": "Freelance"
      }
    }
    </script>

    <link rel="preload" href="/fonts/inter-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

  <body class="bg-[#0a0a0a] text-white font-body antialiased overflow-x-hidden selection:bg-white/20 selection:text-white">
