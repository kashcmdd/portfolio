<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Discord Music Bot preview placeholder">
  <title>Discord Music Bot preview placeholder</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89AACC"/>
      <stop offset="100%" stop-color="#4E85BF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4E85BF"/>
      <stop offset="100%" stop-color="#89AACC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89AACC" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#89AACC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#89AACC" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#89AACC" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#0a0a0a"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <ellipse cx="600" cy="330" rx="560" ry="380" fill="url(#glow)"/>

  <!-- Now-playing card -->
  <g transform="translate(300 150)">
    <rect width="600" height="230" rx="22" fill="#0f1115" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect width="600" height="230" rx="22" fill="url(#fade)"/>

    <!-- Album art tile -->
    <rect x="26" y="26" width="178" height="178" rx="16" fill="#141821" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="115" cy="103" r="40" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="115" cy="103" r="12" fill="url(#accent)"/>
    <rect x="52" y="168" width="126" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.12"/>

    <g font-family="Inter, system-ui, sans-serif">
      <text x="236" y="76" fill="#ffffff" font-size="27" font-weight="600">Lavalink audio pipeline</text>
      <text x="236" y="108" fill="#8a94a3" font-size="17">YouTube · Spotify · SoundCloud</text>

      <!-- Scrubber -->
      <rect x="236" y="140" width="338" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="236" y="140" width="196" height="8" rx="4" fill="url(#accent)"/>
      <circle cx="432" cy="144" r="9" fill="#89AACC"/>
      <text x="236" y="178" fill="#8a94a3" font-size="15">1:24</text>
      <text x="500" y="178" fill="#8a94a3" font-size="15">3:58</text>
    </g>
  </g>

  <!-- Waveform: the Lavalink/ffmpeg read of the project. -->
  <g transform="translate(300 450)" fill="url(#bar)">
    <rect x="0"   y="52"  width="10" height="40"  rx="5" opacity="0.35"/>
    <rect x="20"  y="34"  width="10" height="76"  rx="5" opacity="0.45"/>
    <rect x="40"  y="16"  width="10" height="112" rx="5" opacity="0.6"/>
    <rect x="60"  y="0"   width="10" height="144" rx="5" opacity="0.8"/>
    <rect x="80"  y="26"  width="10" height="92"  rx="5" opacity="0.55"/>
    <rect x="100" y="44"  width="10" height="56"  rx="5" opacity="0.4"/>
    <rect x="120" y="10"  width="10" height="124" rx="5" opacity="0.75"/>
    <rect x="140" y="38"  width="10" height="68"  rx="5" opacity="0.5"/>
    <rect x="160" y="20"  width="10" height="104" rx="5" opacity="0.65"/>
    <rect x="180" y="4"   width="10" height="136" rx="5"/>
    <rect x="200" y="30"  width="10" height="84"  rx="5" opacity="0.55"/>
    <rect x="220" y="48"  width="10" height="48"  rx="5" opacity="0.4"/>
    <rect x="240" y="22"  width="10" height="100" rx="5" opacity="0.7"/>
    <rect x="260" y="42"  width="10" height="60"  rx="5" opacity="0.45"/>
    <rect x="280" y="12"  width="10" height="120" rx="5" opacity="0.78"/>
    <rect x="300" y="36"  width="10" height="72"  rx="5" opacity="0.5"/>
    <rect x="320" y="50"  width="10" height="44"  rx="5" opacity="0.35"/>
    <rect x="340" y="28"  width="10" height="88"  rx="5" opacity="0.6"/>
    <rect x="360" y="8"   width="10" height="128" rx="5" opacity="0.85"/>
    <rect x="380" y="40"  width="10" height="64"  rx="5" opacity="0.45"/>
    <rect x="400" y="18"  width="10" height="108" rx="5" opacity="0.7"/>
    <rect x="420" y="46"  width="10" height="52"  rx="5" opacity="0.4"/>
    <rect x="440" y="32"  width="10" height="80"  rx="5" opacity="0.55"/>
    <rect x="460" y="6"   width="10" height="132" rx="5"/>
    <rect x="480" y="24"  width="10" height="96"  rx="5" opacity="0.65"/>
    <rect x="500" y="44"  width="10" height="56"  rx="5" opacity="0.4"/>
    <rect x="520" y="34"  width="10" height="76"  rx="5" opacity="0.5"/>
    <rect x="540" y="50"  width="10" height="44"  rx="5" opacity="0.32"/>
    <rect x="560" y="16"  width="10" height="112" rx="5" opacity="0.72"/>
    <rect x="580" y="38"  width="10" height="68"  rx="5" opacity="0.48"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="300" y="700" fill="#ffffff" font-size="46" font-weight="600" letter-spacing="0.5">Discord Music Bot</text>
    <rect x="300" y="724" width="130" height="4" rx="2" fill="url(#accent)"/>
    <text x="300" y="768" fill="#8a94a3" font-size="19" letter-spacing="2.5">PREVIEW PENDING</text>
  </g>
</svg>
