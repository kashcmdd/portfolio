<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="ScriptForge cover art">
  <title>ScriptForge</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#B23A0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8C42" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8C42" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="#0a0a0a"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <ellipse cx="430" cy="210" rx="520" ry="380" fill="url(#glow)"/>
  <ellipse cx="960" cy="620" rx="420" ry="320" fill="url(#glow)" opacity="0.6"/>

  <!-- Stacked script cards: the "forge" reading of the name, abstractly. -->
  <g transform="translate(150 150)">
    <rect x="40" y="34" width="560" height="380" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="20" y="17" width="560" height="380" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="0" y="0" width="560" height="380" rx="18" fill="#0f1115" stroke="#ffffff" stroke-opacity="0.16"/>

    <rect x="0" y="0" width="560" height="380" rx="18" fill="url(#fade)"/>
    <rect x="28" y="26" width="504" height="40" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="52" cy="46" r="5" fill="#ff5f57"/>
    <circle cx="72" cy="46" r="5" fill="#febc2e"/>
    <circle cx="92" cy="46" r="5" fill="#28c840"/>
    <rect x="120" y="39" width="150" height="14" rx="7" fill="url(#accent)" opacity="0.75"/>

    <g font-family="Inter, system-ui, sans-serif" font-size="17" fill="#c9d6e4">
      <text x="28" y="112" opacity="0.42">01</text>
      <rect x="66" y="99" width="150" height="12" rx="6" fill="url(#accent)"/>
      <rect x="228" y="99" width="210" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>
      <text x="28" y="156" opacity="0.42">02</text>
      <rect x="66" y="143" width="300" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>
      <text x="28" y="200" opacity="0.42">03</text>
      <rect x="66" y="187" width="118" height="12" rx="6" fill="url(#accent)"/>
      <rect x="196" y="187" width="164" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>
      <text x="28" y="244" opacity="0.42">04</text>
      <rect x="66" y="231" width="232" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>
    </g>

    <!-- Version-conflict branch: the problem the project actually solves. -->
    <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.85">
      <path d="M330 300h70c26 0 30 18 30 34v0"/>
      <path d="M400 300h-70c-26 0-30 18-30 34v0"/>
    </g>
    <circle cx="330" cy="300" r="7" fill="#FF8C42"/>
    <circle cx="400" cy="300" r="7" fill="#B23A0F"/>
    <rect x="240" y="334" width="126" height="18" rx="9" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="384" y="334" width="126" height="18" rx="9" fill="#FF8C42" fill-opacity="0.30"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="150" y="640" fill="#ffffff" font-size="44" font-weight="600" letter-spacing="1">ScriptForge</text>
    <rect x="150" y="662" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="150" y="704" fill="#8a94a3" font-size="19" letter-spacing="2.5">CONTROLLER-SCRIPT HUB · NEXT.JS</text>
  </g>
</svg>
