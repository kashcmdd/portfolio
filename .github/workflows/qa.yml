name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-and-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests read dist/, so the static build has to exist first.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Design gate. The deliberate patterns (italic serif display, section
      # eyebrows, micro labels, the two state dots) are ignored in
      # .impeccable/config.json, so this only fails on new drift: a gradient
      # headline, a clipped label, a new anti-pattern class.
      - name: Design detector
        run: |
          npm run preview -- --port 4173 --strictPort --host 127.0.0.1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/portfolio/ >/dev/null 2>&1 && break
            sleep 1
          done
          npx --yes impeccable@4.9.1 detect http://127.0.0.1:4173/portfolio/ --github
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
